<!-- Offers Hero -->
<section class="bg-primary text-white py-5 text-center position-relative overflow-hidden">
    <!-- Decorative background circles -->
    <div class="position-absolute rounded-circle bg-white opacity-10"
        style=" width: 300px; height: 300px; top: -100px; left: -50px;">
    </div>
    <div class="position-absolute rounded-circle bg-white opacity-10"
        style="width: 500px; height: 500px; bottom: -250px; right: -100px;"></div>

    <div class="container position-relative z-1 py-4">
        <span class="badge bg-warning text-dark px-3 py-2 rounded-pill mb-3 fw-bold tracking-wider">LIMITED TIME</span>
        <h1 class="display-3 fw-bold mb-3">Spring Glow Sale</h1>
        <p class="lead mb-4 text-white-50 mx-auto" style="max-width: 600px;">
            Nurture your natural beauty with our exclusive seasonal offers. Up to 40% off selected organic products.
        </p>

        <!-- Countdown Timer -->
        <div class="d-flex justify-content-center gap-3 gap-md-4 mt-5">
            <div class="d-flex flex-column align-items-center">
                <div class="bg-white text-primary rounded-3 shadow-sm d-flex align-items-center justify-content-center fs-2 fw-bold"
                    style="width: 70px; height: 70px;">{{days}}</div>
                <span class="small mt-2 fw-medium text-uppercase tracking-wider">Days</span>
            </div>
            <div class="fs-1 fw-bold text-white-50 mt-2">:</div>
            <div class="d-flex flex-column align-items-center">
                <div class="bg-white text-primary rounded-3 shadow-sm d-flex align-items-center justify-content-center fs-2 fw-bold"
                    style="width: 70px; height: 70px;">{{hours}}</div>
                <span class="small mt-2 fw-medium text-uppercase tracking-wider">Hours</span>
            </div>
            <div class="fs-1 fw-bold text-white-50 mt-2">:</div>
            <div class="d-flex flex-column align-items-center">
                <div class="bg-white text-primary rounded-3 shadow-sm d-flex align-items-center justify-content-center fs-2 fw-bold"
                    style="width: 70px; height: 70px;">{{minutes}}</div>
                <span class="small mt-2 fw-medium text-uppercase tracking-wider">Mins</span>
            </div>
            <div class="fs-1 fw-bold text-white-50 mt-2 d-none d-sm-block">:</div>
            <div class="d-flex flex-column align-items-center d-none d-sm-flex">
                <div class="bg-white text-primary rounded-3 shadow-sm d-flex align-items-center justify-content-center fs-2 fw-bold"
                    style="width: 70px; height: 70px;">{{seconds}}</div>
                <span class="small mt-2 fw-medium text-uppercase tracking-wider">Secs</span>
            </div>
        </div>
    </div>
</section>

<!-- Offers Grid -->
<section class="py-5 bg-light">
    <div class="container py-4">
        <div class="row g-4">
            <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let item of [1,2,3,4,5,6,7,8]">
                <div class="card h-100 border-0 shadow-sm card-product cursor-pointer rounded-4 overflow-hidden"
                    routerLink="/product/placeholder-offer-id">
                    <div class="position-absolute top-0 end-0 p-3 z-3">
                        <span class="badge bg-danger rounded-pill fs-6 px-3 py-2 shadow-sm fw-bold">-25%</span>
                    </div>
                    <div class="position-relative bg-white rounded-top-4 overflow-hidden border-bottom border-light"
                        style="height: 250px;">
                        <div
                            class="d-flex justify-content-center align-items-center h-100 text-primary opacity-50 bg-secondary bg-opacity-10 transition-transform zoom-img">
                            <span class="display-1">🌿</span>
                        </div>
                        <!-- Quick Add Overlay -->
                        <div class="position-absolute bottom-0 start-0 w-100 p-3 quick-add-overlay text-center pb-0">
                            <button class="btn btn-primary rounded-pill w-100 fw-medium shadow-sm"
                                (click)="$event.stopPropagation()">Add to Cart</button>
                        </div>
                    </div>
                    <div class="card-body p-4 text-center d-flex flex-column bg-white">
                        <p class="text-muted small text-uppercase mb-1 tracking-wider fw-medium">Hair Care</p>
                        <h5 class="card-title fw-bold text-secondary mb-3 fs-6 lh-sm">Nourishing Argan Oil</h5>
                        <div class="mt-auto d-flex justify-content-center align-items-center gap-2">
                            <span class="text-muted text-decoration-line-through small">$40.00</span>
                            <span class="fw-bold fs-5 text-danger">$30.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
